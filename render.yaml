# Render — https://github.com/papufy/papufy-backend
# Banco: Supabase API (SUPABASE_URL + SERVICE_ROLE_KEY)

services:
  - type: web
    name: papufy-api
    runtime: node
    region: oregon
    plan: free
    # --include=dev: NODE_ENV=production no Render omite devDependencies (tsc, @types/*)
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm run start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: FRONTEND_URL
        sync: false
      - key: CORS_ORIGIN
        sync: false
      - key: PUBLIC_BASE_URL
        sync: false
      - key: UPLOAD_DIR
        value: ./uploads
      - key: CRON_SECRET
        generateValue: true

  # Expira anúncios OPEN com expiresAt vencido (1x/dia, 09:00 UTC)
  - type: cron
    name: papufy-expire-listings
    runtime: node
    region: oregon
    # Cron no Render exige plano pago (starter+). Sem cartão: use curl externo diário no mesmo endpoint.
    plan: starter
    schedule: "0 9 * * *"
    buildCommand: npm ci --omit=dev
    startCommand: node scripts/expire-listings-cron.mjs
    envVars:
      - key: CRON_SECRET
        fromService:
          name: papufy-api
          type: web
          envVarKey: CRON_SECRET
      - key: PUBLIC_BASE_URL
        fromService:
          name: papufy-api
          type: web
          envVarKey: PUBLIC_BASE_URL
